<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibDock · 手机控制</title><style>
:root{font:17px system-ui;color:#253329;background:#edf1e9}body{max-width:600px;margin:auto;padding:24px}h1{font-size:32px}small{color:#58665b}button{font:inherit;min-height:62px;padding:16px;border:1px solid #a7b6a4;border-radius:16px;background:#fff;width:100%;margin:7px 0;touch-action:none}button:disabled{opacity:.45}button.active{background:#355d43;color:white}#actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}#status{min-height:60px;white-space:pre-wrap;padding:12px;background:white;border-radius:12px}textarea{box-sizing:border-box;width:100%;min-height:150px;padding:14px;font:inherit;border-radius:12px}#target{overflow-wrap:anywhere}header{border-bottom:1px solid #becabb;padding-bottom:18px}.warn{color:#9a3929}</style>
<header><small>VIBDOCK / LOCAL PAD</small><h1>你的笔记本，随手控制</h1><b id="target">等待扫码配对…</b><p><small>动作执行在此电脑。发送快捷键不代表目标应用已执行。</small></p></header>
<p id="status" role="status">请先在笔记本上打开一次性配对二维码。</p><section id="actions"></section><button id="mic" disabled>切换已选麦克风</button><button id="voice" disabled>按住录音 · 松开转文字</button><button id="cancel" disabled>取消录音 / 识别</button><p id="gap" class="warn"></p><textarea id="text" placeholder="识别结果显示在这里；不会自动注入任何电脑。" readonly></textarea><p><small>录音上限 30 秒。切到后台、取消触摸或连接失败会停止并丢弃录音。未安装可信证书或未授权麦克风时不能录音。</small></p><script src="/pad.js"></script></html>
