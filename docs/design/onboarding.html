<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibDock · 首次配置</title>
<style>
:root{
  color-scheme:light;--paper:#f4f2ec;--surface:#fffdf9;--ink:#1d1b18;--muted:#78736a;--faint:#a39d92;
  --line:#e5e0d6;--line-strong:#d4cdc0;--accent:#b45f2a;--accent-soft:#f3e7dc;--green:#3f7a5f;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.55 "Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-wrap:pretty;
}
button,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,p{margin:0}
h1{font-size:25px;line-height:1.15;letter-spacing:-.6px;font-weight:600;text-wrap:balance}
h2{font-size:17px;line-height:1.25;letter-spacing:-.3px;font-weight:600}
h3{font-size:13px;font-weight:600}
small{font-size:12px;color:var(--muted)}
.kicker{font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:8px 13px;font-size:12.5px;line-height:1}
.button:hover{border-color:#bfb6a7}
.button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.button.primary:hover{background:#a35424}
.button.quiet{border-color:transparent;color:var(--muted)}
.button.quiet:hover{background:#ece8df;color:var(--ink)}
.button:disabled{opacity:.4;cursor:not-allowed}
/* shell */
.topbar{height:58px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand-mark{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--surface)}
.brand span{color:var(--accent)}
.topbar .grow{flex:1}
.topbar .hint{font-size:11.5px;color:var(--faint);white-space:nowrap}
.main{max-width:860px;margin:28px auto 40px;padding:0 22px}
.wizard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.progress{display:flex;gap:0;padding:16px 24px 0;border-bottom:1px solid var(--line)}
.step{flex:1;padding:0 0 13px;color:var(--faint);font-size:11px;border-bottom:2px solid transparent;margin-bottom:-1px}
.step b{display:block;font-size:10px;letter-spacing:.08em;font-weight:550;margin-bottom:3px}
.step[aria-current=true]{color:var(--accent);border-color:var(--accent)}
.step[data-done=true]{color:var(--muted);border-color:var(--line-strong)}
.body{padding:30px 34px 24px;min-height:430px}
.body-head{display:flex;align-items:flex-start;gap:16px}
.body-head .grow{flex:1}
.body-head p{font-size:12.5px;color:var(--muted);margin-top:7px;max-width:560px}
.body-actions{display:flex;align-items:center;gap:8px;flex:none}
.foot{display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--line);background:#fbf9f4}
.foot .grow{flex:1}
.foot .link{font-size:11.5px;color:var(--faint);text-decoration:none}
.foot .link:hover{color:var(--accent)}
/* step 1 */
.connect{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;align-items:center;margin-top:26px}
.device-stage{border:1px solid var(--line);border-radius:10px;background:#f0ede6;display:grid;place-items:center;padding:16px;min-height:270px}
.device-stage svg{width:170px;height:auto;display:block}
.checklist{display:flex;flex-direction:column;gap:10px}
.check{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:12.5px;background:#fff}
.check .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.check small{display:block;font-size:11px;margin-top:1px;color:var(--faint)}
.check b{display:block;font-size:12.5px;font-weight:550}
.status-line{display:flex;align-items:center;gap:7px;margin-top:16px;font-size:11.5px;color:var(--green)}
/* step 2 templates */
.templates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.template{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:9px;padding:13px;text-align:left}
.template:hover{border-color:var(--line-strong)}
.template[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.template .radio{width:15px;height:15px;border:1.5px solid var(--line-strong);border-radius:50%;flex:none;margin-top:2px;position:relative}
.template[aria-pressed=true] .radio{border-color:var(--accent)}
.template[aria-pressed=true] .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.template b{display:block;font-size:12.5px;font-weight:550}
.template small{display:block;font-size:11px;line-height:1.5;margin-top:2px;color:var(--faint)}
.template .keys{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.key-chip{font:9.5px var(--mono,"Cascadia Mono",monospace);border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--muted)}
/* step 3 mapping */
.mapping{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.mini-device{border:1px solid var(--line);border-radius:10px;background:#f0ede6;padding:14px;display:grid;place-items:center}
.mini-device svg{width:150px;display:block}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.map-row{display:grid;grid-template-columns:58px 1fr 172px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.map-row .num{font:10px var(--mono,"Cascadia Mono",monospace);color:var(--faint)}
.map-row b{display:block;font-size:12.5px;font-weight:550}
.map-row small{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}
.select{width:100%;border:1px solid var(--line-strong);background:#fff;border-radius:6px;padding:7px 8px;font-size:12px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8d8578 50%),linear-gradient(135deg,#8d8578 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.mapping-note{font-size:11px;color:var(--faint);line-height:1.6;margin-top:12px}
/* gesture matrix */
.gesture-matrix{margin-top:20px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.matrix-head,.matrix-row{display:grid;grid-template-columns:112px repeat(3,minmax(0,1fr))}
.matrix-head{background:#fbf9f4;border-bottom:1px solid var(--line)}
.matrix-head span{font-size:10.5px;color:var(--faint);padding:9px 11px;border-right:1px solid var(--line)}
.matrix-head span:last-child{border-right:0}
.matrix-row{border-bottom:1px solid var(--line)}
.matrix-row:last-child{border-bottom:0}
.matrix-key{display:flex;flex-direction:column;justify-content:center;padding:11px;border-right:1px solid var(--line);background:#fbf9f4}
.matrix-key .num{font:9.5px var(--mono,monospace);color:var(--faint)}
.matrix-key b{font-size:12.5px;font-weight:550;margin-top:2px}
.matrix-cell{min-height:54px;border-right:1px solid var(--line);padding:8px 10px;text-align:left;background:#fff;display:flex;flex-direction:column;justify-content:center;gap:2px}
.matrix-cell:last-child{border-right:0}
.matrix-cell:hover{background:var(--accent-soft)}
.matrix-cell[data-set=true]{background:#fcf7f1}
.matrix-cell b{font-size:11.5px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matrix-cell small{font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.matrix-cell[data-set=false] b{color:var(--faint);font-weight:400}
/* slot editor */
.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border:1px solid var(--line);border-radius:7px;padding:3px;background:#fbf9f4;margin-top:14px}
.mode-tab{border:0;background:transparent;border-radius:5px;padding:6px;font-size:11px;color:var(--muted)}
.mode-tab[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chord-row{display:flex;gap:7px;margin-top:8px}
.chord-row input{flex:1;border:1px solid var(--line-strong);border-radius:6px;padding:8px;font-size:12px;background:#fff;min-width:0}
.chord-row button{flex:none}
.record-hint{font-size:10.5px;color:var(--accent);margin-top:6px;min-height:15px}
.editor-note{font-size:10.5px;color:var(--faint);line-height:1.55;margin-top:9px}
/* step 4 test */
.test-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.test-tile{border:1px solid var(--line);background:#fff;border-radius:9px;padding:14px;text-align:left;min-height:112px;display:flex;flex-direction:column;gap:5px}
.test-tile:hover{border-color:var(--line-strong)}
.test-tile[data-ok=true]{border-color:rgba(63,122,95,.5);background:#f1f7f3}
.test-tile .num{font:10px var(--mono,monospace);color:var(--faint)}
.test-tile b{font-size:13px;font-weight:550;margin-top:auto}
.test-tile small{font-size:10.5px;color:var(--faint)}
.test-tile .mark{font-size:10px;color:var(--green);margin-top:3px}
.test-note{margin-top:16px;border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fbf9f4;font-size:11px;color:var(--muted);line-height:1.6}
/* done */
.done{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 0}
.done-badge{width:42px;height:42px;border:1px solid rgba(63,122,95,.4);border-radius:50%;display:grid;place-items:center;color:var(--green);background:#f1f7f3;margin-bottom:16px}
.done p{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7;max-width:560px}
.done-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
/* agent modal */
.backdrop{position:fixed;inset:0;background:rgba(29,27,24,.18);z-index:50;display:grid;place-items:center;padding:20px}
.modal{width:min(600px,100%);max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 20px 60px #281f1620}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.modal-head .grow{flex:1}
.modal-close{width:26px;height:26px;border:1px solid var(--line);border-radius:5px;color:var(--muted);display:grid;place-items:center;font-size:15px}
.modal p{font-size:12px;color:var(--muted);line-height:1.7;margin-top:9px}
.prompt{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#fbf9f4;padding:13px;font:11.5px/1.65 var(--mono,"Cascadia Mono",monospace);white-space:pre-wrap;color:var(--ink)}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:#2c2924;color:#fff;font-size:12px;border-radius:6px;padding:8px 12px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.main{padding:0 12px;margin-top:14px}.body{padding:22px 18px}.connect{grid-template-columns:1fr}.device-stage{min-height:220px}.templates{grid-template-columns:1fr}.mapping{grid-template-columns:1fr}.mini-device svg{width:130px}.map-row{grid-template-columns:44px 1fr 150px}.test-grid{grid-template-columns:1fr}.progress{padding:12px 14px 0}.step{font-size:10px}.foot{padding:12px 16px}.topbar{padding:0 14px}.topbar .hint{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">V</span><span>Vib<span>Dock</span></span></div>
  <div class="grow"></div>
  <span class="hint">首次配置 · 约 2 分钟</span>
  <button class="button quiet" id="agentButton">让 Agent 配置</button>
</header>
<main class="main">
  <div class="wizard">
    <nav class="progress" id="progress" aria-label="配置步骤"></nav>
    <div class="body" id="body"></div>
    <div class="foot">
      <a class="link" href="../guide/installation.zh-CN.md" id="guideLink">查看传统安装说明</a>
      <span class="grow"></span>
      <button class="button" id="back">上一步</button>
      <button class="button primary" id="next">下一步</button>
    </div>
  </div>
</main>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const PROFILES=[
  {id:'wechat',name:'微信语音 · Ctrl + Win'},
  {id:'codex',name:'Codex 语音'},
  {id:'dsh',name:'DSH 工作台'},
  {id:'mute',name:'麦克风静音'},
  {id:'enter',name:'回车 / 确认'},
  {id:'esc',name:'Esc / 取消'},
  {id:'empty',name:'暂不分配'}
];
const GESTURES=[{id:0,name:'单击'},{id:1,name:'双击'},{id:2,name:'长按'}];
const KEYS=['语音键','确认键','取消键'];
const emptySlots=()=>[[ '', '', '' ],[ '', '', '' ],[ '', '', '' ]];
const TEMPLATES=[
  {id:'voice',name:'语音工作流',desc:'微信语音、Codex、DSH 分到语音键的三种手势，其余按键保留确认/取消。',mapping:[['wechat','codex','dsh'],['enter','',''],['esc','','']]},
  {id:'coding',name:'编程助手',desc:'Codex、DSH、麦克风静音放在语音键，专注编码。',mapping:[['codex','dsh','mute'],['enter','',''],['esc','','']]},
  {id:'wechat',name:'微信输入法',desc:'保留最常见的聊天与确认按键。',mapping:[['wechat','',''],['enter','',''],['esc','','']]},
  {id:'blank',name:'空白配置',desc:'从零开始，9 个动作位全部手动分配。',mapping:emptySlots()}
];
const STEPS=[{n:'01',t:'连接设备'},{n:'02',t:'选择模板'},{n:'03',t:'确认动作'},{n:'04',t:'测试反馈'}];
const state={
  step:new URL(location.href).searchParams.get('step')?Number(new URL(location.href).searchParams.get('step')):1,
  template:'voice',gestures:TEMPLATES[0].mapping.map(x=>[...x]),tested:new Set(),done:false,
  editor:null,agent:new URL(location.href).searchParams.get('agent')==='1'
};
const editParam=new URL(location.href).searchParams.get('edit');
if(editParam){const [key,gesture]=editParam.split(':').map(Number);const value=state.gestures[key][gesture];state.editor={key,gesture,mode:value?(value.startsWith('chord:')?'chord':'profile'):'profile',profile:value&&!value.startsWith('chord:')?value:'wechat',chord:value?.startsWith('chord:')?value.slice(6):'',recording:false}}
let toastTimer=0;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function profileName(id){return (PROFILES.find(p=>p.id===id)||PROFILES[6]).name}
function slotLabel(value){if(!value)return '未配置';if(value.startsWith('chord:'))return value.slice(6);return profileName(value)}
function slotKind(value){if(!value)return '点击配置';if(value.startsWith('chord:'))return '手动录入';return 'Profile'}
function configuredCount(){return state.gestures.flat().filter(Boolean).length}
function setStep(n){state.step=Math.max(1,Math.min(4,n));state.done=false;const u=new URL(location.href);u.searchParams.set('step',state.step);history.replaceState(null,'',u);render()}
function chooseTemplate(id){state.template=id;const t=TEMPLATES.find(x=>x.id===id);state.gestures=t.mapping.map(x=>[...x]);state.tested=new Set();state.editor=null;render()}
function testKey(key,gesture){state.tested.add(`${key}:${gesture}`);render();showToast('已收到反馈（原型预览）')}
function finish(){state.done=true;render();showToast('配置完成（原型预览）')}
function render(){
  document.getElementById('progress').innerHTML=STEPS.map((s,i)=>`<div class="step" aria-current="${state.step===i+1}" data-done="${state.step>i+1}"><b>${s.n}</b>${s.t}</div>`).join('');
  document.getElementById('back').disabled=state.step===1||state.done;
  const next=document.getElementById('next');
  next.textContent=state.done?'完成':'下一步';
  const body=document.getElementById('body');
  if(state.done){body.innerHTML=doneView();next.textContent='关闭向导';}
  else if(state.step===1)body.innerHTML=stepConnect();
  else if(state.step===2)body.innerHTML=stepTemplate();
  else if(state.step===3)body.innerHTML=stepMapping();
  else body.innerHTML=stepTest();
  renderModal();
}
function deviceSVG(){
  return `<svg viewBox="0 0 150 300" role="img" aria-label="Vibe Key">
    <rect x="30" y="5" width="90" height="288" rx="15" fill="#fffdf9" stroke="#2b2722" stroke-width="1.2"/>
    <rect x="36" y="11" width="78" height="276" rx="11" fill="none" stroke="#ece7dd"/>
    ${[0,1,2,3].map(r=>[0,1,2,3,4,5].map(c=>`<circle cx="${54+c*8}" cy="${24+r*6}" r="1.2" fill="#c4bcae"/>`).join('')).join('')}
    <circle cx="75" cy="82" r="30" fill="#f1eee6" stroke="#c9c2b5"/>
    <circle cx="75" cy="82" r="23" fill="none" stroke="#ded7ca"/><path d="M75 63v9" stroke="#7d766a" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="45" y="132" width="60" height="38" rx="8" fill="#fffdf9" stroke="#b9b2a5"/><circle cx="75" cy="151" r="12" fill="#f1eee6" stroke="#d9d2c5"/><g transform="translate(69 145)" fill="none" stroke="#6e6a61" stroke-width="1.3" stroke-linecap="round"><path d="M6 9a2 2 0 0 0 2-2V4a2 2 0 1 0-4 0v3a2 2 0 0 0 2 2Z"/><path d="M3 8a3 3 0 0 0 6 0M6 11v2M4 13h4"/></g>
    <rect x="45" y="184" width="60" height="38" rx="8" fill="#fffdf9" stroke="#b9b2a5"/><circle cx="75" cy="203" r="12" fill="#f1eee6" stroke="#d9d2c5"/><path d="m70 203 3 3 6-6" fill="none" stroke="#6e6a61" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="45" y="236" width="60" height="38" rx="8" fill="#fffdf9" stroke="#b9b2a5"/><circle cx="75" cy="255" r="12" fill="#f1eee6" stroke="#d9d2c5"/><path d="m71 251 8 8M79 251l-8 8" fill="none" stroke="#6e6a61" stroke-width="1.4" stroke-linecap="round"/>
  </svg>`
}
function stepConnect(){
  return `<div class="body-head"><div class="grow"><div class="kicker">Step 01</div><h1>先把 Vibe Key 接通。</h1><p>插好 2.4G 接收器，打开设备电源，按任意按键唤醒。不需要安装 Ulanzi Studio。</p></div></div>
  <div class="connect"><div class="device-stage">${deviceSVG()}</div><div class="checklist">
    <div class="check"><span class="dot"></span><span><b>接收器已插入</b><small>USB-A / 2.4G，不经过 Studio</small></span></div>
    <div class="check"><span class="dot"></span><span><b>设备已唤醒</b><small>按任意按键后状态灯亮起</small></span></div>
    <div class="check"><span class="dot"></span><span><b>本机服务已运行</b><small>launcher 或 vibdock service-start</small></span></div>
    <div class="status-line"><span class="dot" style="background:var(--green)"></span>检测到 Vibe Key · 固件 4.4.0</div>
  </div></div>`
}
function stepTemplate(){
  const flat=t=>t.mapping.flat().filter(Boolean);
  return `<div class="body-head"><div class="grow"><div class="kicker">Step 02</div><h1>从一个模板开始。</h1><p>模板只写入初始的单键/双击/长按分配，之后可以随时在 Workbench 里改；每个按键有 3 个手势位。</p></div></div>
  <div class="templates">${TEMPLATES.map(t=>{const values=flat(t);return `<button class="template" data-template="${t.id}" aria-pressed="${state.template===t.id}"><span class="radio"></span><span><b>${esc(t.name)}</b><small>${esc(t.desc)}</small><span class="keys">${values.slice(0,4).map(v=>`<span class="key-chip">${esc(slotLabel(v))}</span>`).join('')}${values.length>4?`<span class="key-chip">+${values.length-4}</span>`:''}</span></span></button>`}).join('')}</div>`
}
function stepMapping(){
  return `<div class="body-head"><div class="grow"><div class="kicker">Step 03</div><h1>确认 9 个动作位。</h1><p>每个按键都可以配置单击、双击、长按；点击格子选 Profile、手动输入组合键，或留空。</p></div><div class="body-actions"><span class="kicker" style="margin-right:8px">${configuredCount()}/9 已配置</span><button class="button quiet" id="resetMapping">恢复模板</button></div></div>
  <div class="gesture-matrix"><div class="matrix-head"><span>按键</span>${GESTURES.map(g=>`<span>${g.name}</span>`).join('')}</div>
  ${KEYS.map((name,key)=>`<div class="matrix-row"><div class="matrix-key"><span class="num">0${key+1}</span><b>${name}</b></div>${GESTURES.map(g=>{const value=state.gestures[key][g.id];return `<button class="matrix-cell" data-edit="${key}:${g.id}" data-set="${!!value}"><b>${esc(slotLabel(value))}</b><small>${esc(slotKind(value))}</small></button>`}).join('')}</div>`).join('')}</div>
  <p class="mapping-note">Profile 由插件提供；手动录入会保存为一条组合键。一个按键的某一种手势只能有一个动作，冲突由服务端校验。AU05 的手势需要哨兵键支持，生产接入仍在校验中。</p>`
}
function stepTest(){
  const cells=[];
  KEYS.forEach((name,key)=>GESTURES.forEach(g=>{const value=state.gestures[key][g.id];const id=`${key}:${g.id}`;cells.push(`<button class="test-tile" data-test="${id}" data-ok="${state.tested.has(id)}" ${value?'':'disabled'}><span class="num">0${key+1} · ${g.name}</span><b>${esc(name)}</b><small>${value?esc(slotLabel(value)):'未配置'}</small>${state.tested.has(id)?'<span class="mark">✓ 已收到</span>':`<span class="mark" style="color:var(--faint)">${value?'等待测试':'先配置'}</span>`}</button>`)}));
  return `<div class="body-head"><div class="grow"><div class="kicker">Step 04</div><h1>逐个确认动作位。</h1><p>点按已配置的格子模拟反馈；物理按键测试会进入最近触发日志。测试只记录向导结果，不写入设备。</p></div></div>
  <div class="test-grid">${cells.join('')}</div>
  <div class="test-note">没有反馈时：确认服务在运行、接收器已插好，再检查该按键是否被直发组合键或应用快捷键占用。手动录入的快捷键不会自动验证目标应用。</div>`
}
function doneView(){
  return `<div class="done"><div class="done-badge">✓</div><h1>可以开始用了。</h1><p>已为 Vibe Key 准备 ${configuredCount()} 个动作位，包含单击 / 双击 / 长按。接下来可以继续添加多键组合，或把同一套 Profile 打开到 Pad 上。</p><div class="done-actions"><button class="button primary" data-action="finish">打开 Workbench</button><button class="button" data-action="pad">打开 Virtual Pad</button><button class="button quiet" id="doneAgent">让 Agent 继续配置</button></div></div>`
}
function openEditor(key,gesture){
  const value=state.gestures[key][gesture];
  const chord=value?.startsWith('chord:')?value.slice(6):'';
  state.editor={key,gesture,mode:value?(chord?'chord':'profile'):'none',profile:value&&!chord?value:'wechat',chord,recording:false};
  render();
}
function renderModal(){
  const root=document.getElementById('modalRoot');
  if(state.editor){root.innerHTML=editorView();return}
  if(!state.agent){root.innerHTML='';return}
  const prompt=`请用 VibDock 的 agent skill 帮我配置 Vibe Key：
- 按钮 1：单击微信语音，双击 Codex，长按 DeepSeek Harness
- 按钮 2：单击回车
- 按钮 3：单击 Esc

先读取 GET /api/plugins 和 GET /api/actions，确认当前设备和已保存配置；
不要覆盖已有绑定。每一步修改前先告诉我将写什么，完成后用 hardware-status 或 recent_actions 读回结果。`;
  root.innerHTML=`<div class="backdrop" data-action="close-agent"><div class="modal" role="dialog" aria-modal="true" aria-label="让 Agent 配置">
    <div class="modal-head"><div class="grow"><div class="kicker">Agent setup</div><h2>把这段话交给 Agent</h2><small>它会通过本机服务和 CLI 完成配置，并在每一步确认。</small></div><button class="modal-close" data-action="close-agent" aria-label="关闭">×</button></div>
    <p>VibDock 的 Agent skill 位于 <code>skills/vibdock/SKILL.md</code>。用户只需要说“帮我把按钮 2 配置成打开 Codex”，Agent 就会读取插件清单、解析应用引用、创建或修改动作，并回报写入结果。</p>
    <div class="prompt" id="agentPrompt">${esc(prompt)}</div>
    <div class="modal-actions"><button class="button" data-action="copy-prompt">复制指令</button><button class="button quiet" data-action="close-agent">稍后</button></div>
  </div></div>`;
}
function editorView(){
  const e=state.editor;const keyName=KEYS[e.key];const gesture=GESTURES.find(g=>g.id===e.gesture).name;
  const tabs=[['profile','Profile'],['chord','手动快捷键'],['none','不配置']];
  return `<div class="backdrop" data-action="close-editor"><div class="modal" role="dialog" aria-modal="true" aria-label="配置 ${keyName} ${gesture}">
    <div class="modal-head"><div class="grow"><div class="kicker">0${e.key+1} · ${gesture}</div><h2>${keyName}</h2><small>选择 Profile，或手动输入/录入一个组合键。</small></div><button class="modal-close" data-action="close-editor" aria-label="关闭">×</button></div>
    <div class="mode-tabs" role="tablist" aria-label="配置方式">${tabs.map(([mode,label])=>`<button class="mode-tab" data-mode="${mode}" aria-selected="${e.mode===mode}">${label}</button>`).join('')}</div>
    ${e.mode==='profile'?`<div class="field" style="margin-top:16px"><label>执行 Profile</label><select class="select" id="slotProfile" aria-label="Profile">${PROFILES.filter(p=>p.id!=='empty').map(p=>`<option value="${p.id}" ${p.id===e.profile?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`:''}
    ${e.mode==='chord'?`<div class="field" style="margin-top:16px"><label>组合键</label><div class="chord-row"><input id="chordInput" value="${esc(e.chord)}" placeholder="例如 Ctrl + Shift + Space" autocomplete="off" spellcheck="false"><button class="button" data-action="record-chord">${e.recording?'请按键…':'录入按键'}</button></div><div class="record-hint">${e.recording?'正在监听键盘，按 Escape 取消':'也可以直接手动输入组合键'}</div></div>`:''}
    ${e.mode==='none'?'<p class="editor-note" style="margin-top:16px">这个手势位保持为空，不会触发任何动作。</p>':''}
    <p class="editor-note">当前是首次配置原型；手势输入路径、持久化和固件写入还没有接到生产服务。手动录入的快捷键会作为一条本地组合键保存。</p>
    <div class="modal-actions"><button class="button" data-action="close-editor">取消</button><button class="button primary" data-action="save-editor">保存</button></div>
  </div></div>`;
}
function saveEditor(){
  const e=state.editor;if(!e)return;
  if(e.mode==='chord'&&!e.chord.trim()){showToast('请输入或录入组合键');return}
  const value=e.mode==='profile'?e.profile:e.mode==='chord'?`chord:${e.chord.trim()}`:'';
  state.gestures[e.key][e.gesture]=value;state.tested.delete(`${e.key}:${e.gesture}`);state.editor=null;render();
  showToast('已保存动作位（原型预览，不写入设备）');
}
function setEditorMode(mode){if(!state.editor)return;state.editor.mode=mode;state.editor.recording=false;render()}
function recordChord(){if(!state.editor)return;state.editor.recording=true;render();showToast('请按下组合键')}
function chordFromEvent(e){
  const mods=[];if(e.ctrlKey)mods.push('Ctrl');if(e.altKey)mods.push('Alt');if(e.shiftKey)mods.push('Shift');if(e.metaKey)mods.push('Win');
  let key=e.key;if(['Control','Alt','Shift','Meta'].includes(key))return '';
  if(key===' ')key='Space';else if(key==='Escape')key='Esc';else if(key.length===1)key=key.toUpperCase();
  return [...mods,key].join(' + ');
}
document.addEventListener('click',e=>{
  if(e.target.closest('.modal')&&!e.target.closest('[data-action]'))return;
  const tpl=e.target.closest('[data-template]');if(tpl){chooseTemplate(tpl.dataset.template);return}
  const edit=e.target.closest('[data-edit]');if(edit){const [key,gesture]=edit.dataset.edit.split(':');openEditor(Number(key),Number(gesture));return}
  const test=e.target.closest('[data-test]');if(test){const [key,gesture]=test.dataset.test.split(':');testKey(Number(key),Number(gesture));return}
  if(e.target.closest('#resetMapping')){chooseTemplate(state.template);return}
  if(e.target.closest('#agentButton')||e.target.closest('#doneAgent')){state.agent=true;render();return}
  if(e.target.closest('[data-action="close-agent"]')){state.agent=false;render();return}
  if(e.target.closest('[data-action="close-editor"]')){state.editor=null;render();return}
  if(e.target.closest('[data-action="save-editor"]')){saveEditor();return}
  if(e.target.closest('[data-action="copy-prompt"]')){const text=document.getElementById('agentPrompt')?.textContent||'';navigator.clipboard?.writeText(text).then(()=>showToast('已复制 Agent 指令')).catch(()=>showToast('复制失败，请手动选择'));return}
  const mode=e.target.closest('[data-mode]');if(mode){setEditorMode(mode.dataset.mode);return}
  if(e.target.closest('[data-action="record-chord"]')){recordChord();return}
  if(e.target.closest('[data-action="finish"]')){window.location.href='prototype-clean.html';return}
  if(e.target.closest('[data-action="pad"]')){window.location.href='prototype-pad.html';return}
  if(e.target.closest('#next')){if(state.done){window.location.href='prototype-clean.html';return}if(state.step<4)setStep(state.step+1);else finish();return}
  if(e.target.closest('#back')){setStep(state.step-1);return}
});
document.addEventListener('change',e=>{
  if(e.target.id==='slotProfile'&&state.editor){state.editor.mode='profile';state.editor.profile=e.target.value}
});
document.addEventListener('input',e=>{if(e.target.id==='chordInput'&&state.editor){state.editor.chord=e.target.value}});
document.addEventListener('keydown',e=>{
  if(state.editor?.recording){
    e.preventDefault();
    if(e.key==='Escape'){state.editor.recording=false;render();return}
    const chord=chordFromEvent(e);
    if(!chord)return;
    state.editor.chord=chord;state.editor.recording=false;render();return;
  }
  if(e.key==='Escape'){if(state.editor){state.editor=null;render();return}if(state.agent){state.agent=false;render()}}
});
render();
</script>
</body></html>
