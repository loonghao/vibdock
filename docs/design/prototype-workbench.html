<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibDock · 插件工作台原型</title>
<style>
:root{
  --canvas:#111315;--surface:#181b1e;--surface-2:#1e2225;--surface-3:#262b2f;
  --line:rgba(255,255,255,.075);--line-strong:rgba(255,255,255,.14);
  --ink:#f1eee7;--ink-2:#b7b5ae;--ink-3:#7f817c;
  --amber:#e7b96f;--amber-soft:rgba(231,185,111,.13);--jade:#7fd3b6;--jade-soft:rgba(127,211,182,.12);
  --blue:#9eb8d8;--violet:#b8a8e6;--red:#e79b8c;
  --r-sm:8px;--r-md:14px;--r-lg:22px;
  --mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:
  radial-gradient(1200px 700px at 78% -10%,rgba(231,185,111,.055),transparent 55%),
  radial-gradient(900px 600px at 8% 105%,rgba(127,211,182,.045),transparent 60%),
  var(--canvas);
  color:var(--ink);font:14px/1.5 "Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;text-wrap:pretty}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
a{color:var(--amber);text-decoration:none}
h1,h2,h3,p{margin:0}
h1{font-size:26px;line-height:1.15;letter-spacing:-.7px;text-wrap:balance}
h2{font-size:16px;letter-spacing:-.2px}
h3{font-size:13px;letter-spacing:.01em}
small{color:var(--ink-3);font-size:12px}
.icon{width:18px;height:18px;flex:none}
.mono{font-family:var(--mono);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{background:var(--jade);box-shadow:0 0 0 4px var(--jade-soft)}
.dot.warn{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.dot.off{background:var(--ink-3)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.tag.amber{color:var(--amber);border-color:rgba(231,185,111,.35);background:var(--amber-soft)}
.tag.jade{color:var(--jade);border-color:rgba(127,211,182,.3);background:var(--jade-soft)}
.btn{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:9px;padding:9px 13px;font-size:13px;transition:border-color .16s,background .16s,transform .1s}
.btn:hover{border-color:rgba(231,185,111,.55);background:var(--surface-3)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#211b12;font-weight:650}
.btn.primary:hover{background:#f0c987}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--red);border-color:rgba(231,155,140,.28)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* shell */
.app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:86px}
.topbar{height:64px;flex:none;display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(17,19,21,.82);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#f1cf97,#c98f3f);display:grid;place-items:center;color:#211b12;font-size:11px;font-weight:800;letter-spacing:-.4px;box-shadow:inset 0 0 0 1px #fff5}
.brand b{font-size:17px;letter-spacing:-.4px;font-weight:650}
.brand b span{color:var(--amber)}
.brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:-2px}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12px;min-width:0}
.crumbs b{color:var(--ink-2);font-weight:500}
.crumbs .slash{color:var(--line-strong)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.conn-pill{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink-2);background:var(--surface)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#3b4742,#222b28);border:1px solid var(--line-strong);display:grid;place-items:center;font-size:11px;color:var(--jade)}
/* left rail */
.workbench{display:grid;grid-template-columns:228px minmax(0,1fr) 386px;flex:1;min-height:0}
.rail{border-right:1px solid var(--line);padding:18px 13px 28px;display:flex;flex-direction:column;gap:24px;background:linear-gradient(180deg,rgba(30,34,37,.32),transparent 28%)}
.rail-head{display:flex;align-items:center;justify-content:space-between;color:var(--ink-3);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:0 6px}
.rail-head button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink-3);display:grid;place-items:center;padding:0}
.rail-head button:hover{color:var(--amber);border-color:var(--amber)}
.device-item{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:11px;padding:9px 8px;text-align:left;margin-bottom:2px}
.device-item:hover{background:var(--surface-2)}
.device-item[aria-selected=true]{background:var(--surface-2);border-color:var(--line);box-shadow:inset 2px 0 0 var(--amber)}
.device-thumb{width:32px;height:42px;border-radius:7px;background:linear-gradient(150deg,#e9e5db,#b9b5aa);border:1px solid #ffffff44;position:relative;flex:none;box-shadow:0 4px 8px #0005}
.device-thumb:before{content:"";position:absolute;left:9px;top:5px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bdb9ae);border:1px solid #9a968a}
.device-thumb:after{content:"";position:absolute;left:8px;top:21px;width:15px;height:4px;border-radius:2px;background:#d4d0c6;box-shadow:0 6px 0 #d4d0c6,0 12px 0 #d4d0c6}
.controller-thumb{width:34px;height:38px;flex:none;display:grid;place-items:center;border-radius:8px;background:#171b1c;border:1px solid var(--line)}
.controller-thumb svg{width:30px;height:30px;display:block}
.device-item b{display:block;font-size:13px;font-weight:550}
.device-item small{display:block;font-size:11px}
.device-item .dot{margin-left:auto}
.plugin-mini{display:flex;align-items:center;gap:9px;width:100%;border:1px solid transparent;background:transparent;border-radius:9px;padding:7px;text-align:left}
.plugin-mini:hover{background:var(--surface-2)}
.plugin-mini b{display:block;font-size:12px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plugin-mini small{font-size:10px}
.plugin-glyph{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:-.2px;flex:none;border:1px solid var(--line-strong);background:var(--surface-2)}
.rail-note{font-size:11px;line-height:1.65;color:var(--ink-3);padding:10px;border:1px dashed var(--line);border-radius:10px;background:rgba(255,255,255,.012)}
/* canvas */
.canvas{padding:24px 28px 110px;overflow:auto;min-width:0}
.canvas-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.canvas-head h1{font-size:22px}
.canvas-head small{display:block;margin-top:4px;font-size:12px}
.canvas-head .spacer{flex:1}
.stage{position:relative;border:1px solid var(--line);border-radius:24px;background:
  radial-gradient(600px 430px at 42% 44%,rgba(231,185,111,.10),transparent 62%),
  radial-gradient(500px 380px at 70% 90%,rgba(127,211,182,.035),transparent 60%),
  #15181a;min-height:582px;display:grid;grid-template-columns:minmax(300px,1fr) 282px;align-items:center;gap:6px;padding:22px 24px;overflow:hidden}
.stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 42% 45%,black,transparent 70%);pointer-events:none}
.stage-device{display:flex;justify-content:center;align-items:center;position:relative;z-index:1;min-height:530px}
.vibe-key{width:330px;height:auto;display:block;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.vibe-key.compact{width:168px}
.vibe-key.compact .vk-dongle{display:none}
.device-key{cursor:pointer;outline:none}
.device-key .key-face,.device-key .knob-face{transition:filter .16s,stroke .16s}
.device-key:hover .key-face,.device-key:hover .knob-face{filter:brightness(1.07)}
.device-key.active .key-face,.device-key.active .knob-face{stroke:var(--amber);stroke-width:3}
.device-key:focus-visible .key-face,.device-key:focus-visible .knob-face{stroke:var(--amber);stroke-width:3}
.device-key .key-halo{opacity:0;transition:opacity .16s}
.device-key.active .key-halo,.device-key:hover .key-halo{opacity:.9}
.callouts{display:flex;flex-direction:column;gap:9px;position:relative;z-index:2}
.callout{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(24,27,30,.72);backdrop-filter:blur(10px);border-radius:12px;padding:10px 12px;text-align:left;transition:border-color .16s,background .16s,transform .16s}
.callout:hover{border-color:var(--line-strong);background:var(--surface-2)}
.callout[aria-pressed=true]{border-color:rgba(231,185,111,.6);background:linear-gradient(100deg,rgba(231,185,111,.12),rgba(24,27,30,.8))}
.callout .idx{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.callout b{display:block;font-size:12px;font-weight:600}
.callout small{display:block;font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callout .dot{justify-self:end}
.stage-hint{position:absolute;left:24px;bottom:18px;z-index:2;display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:11px}
.stage-hint kbd{font:10px var(--mono);border:1px solid var(--line);border-bottom-color:var(--line-strong);padding:2px 5px;border-radius:4px;color:var(--ink-2);background:var(--surface)}
/* profile deck */
.deck-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 2px 10px}
.deck-head h2{font-size:14px}
.deck-head small{font-size:11px}
.profile-deck{display:grid;grid-auto-flow:column;grid-auto-columns:216px;gap:10px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:thin}
.profile-card{border:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),rgba(24,27,30,.65));border-radius:14px;padding:13px;text-align:left;min-height:142px;display:flex;flex-direction:column;gap:8px;transition:border-color .16s,transform .16s,background .16s}
.profile-card:hover{border-color:var(--line-strong);transform:translateY(-1px);background:var(--surface-3)}
.profile-card[data-assigned=true]{border-color:rgba(231,185,111,.58);box-shadow:inset 0 0 0 1px rgba(231,185,111,.18)}
.profile-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.profile-card b{font-size:13px;font-weight:600;letter-spacing:-.1px}
.profile-card p{font-size:11px;color:var(--ink-3);line-height:1.55;min-height:34px}
.profile-card .steps-mini{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-2);background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-family:var(--mono);white-space:nowrap}
.profile-card .assign-mark{font-size:10px;color:var(--amber);font-family:var(--mono)}
/* inspector */
.inspector{border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(30,34,37,.55),var(--surface));padding:20px 18px 30px;overflow:auto}
.inspector-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.inspector-head .eyebrow{font:10px var(--mono);color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.inspector-head h2{margin-top:5px;font-size:19px;letter-spacing:-.4px}
.inspector-head small{display:block;margin-top:4px;font-size:11px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#131619;margin:16px 0}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 4px;font-size:11px;color:var(--ink-3)}
.seg button[aria-selected=true]{background:var(--surface-3);color:var(--ink);box-shadow:0 1px 0 #ffffff08}
.inspector label{display:block;font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);margin:14px 0 6px;text-transform:uppercase}
.select{width:100%;border:1px solid var(--line-strong);background:#131619;border-radius:9px;padding:10px 11px;font-size:12.5px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field-note{font-size:11px;color:var(--ink-3);line-height:1.6;margin-top:6px}
.sequence{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.sequence-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sequence-head h3{font-size:12px;color:var(--ink-2);font-weight:550}
.step-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.step{border:1px solid var(--line);background:#15181b;border-radius:10px;padding:9px 10px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px}
.step .step-no{width:22px;height:22px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font:10px var(--mono);color:var(--ink-3)}
.step b{display:block;font-size:11.5px;font-weight:500;line-height:1.35}
.step small{display:block;font-size:10px;margin-top:1px}
.step .grip{color:var(--ink-3);font-size:13px;letter-spacing:-2px;padding:2px}
.step-add{width:100%;border:1px dashed var(--line-strong);background:transparent;border-radius:9px;padding:8px;font-size:11.5px;color:var(--ink-3);margin-top:8px}
.step-add:hover{color:var(--amber);border-color:rgba(231,185,111,.45)}
.inspector-actions{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.inspector-actions .btn{flex:1}
.auto-card{margin-top:16px;border:1px solid rgba(127,211,182,.18);background:linear-gradient(135deg,rgba(127,211,182,.08),transparent);border-radius:11px;padding:11px;display:flex;gap:9px}
.auto-card .icon{color:var(--jade);margin-top:1px}
.auto-card b{display:block;font-size:11.5px;color:var(--jade);font-weight:550}
.auto-card p{font-size:11px;color:var(--ink-3);line-height:1.55;margin-top:3px}
.auto-card button{margin-top:7px}
/* variant B */
.workbench-b{display:grid;grid-template-columns:84px minmax(0,1fr) 360px;flex:1;min-height:0}
.plugin-rail{border-right:1px solid var(--line);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(24,27,30,.5)}
.plugin-rail .rail-label{font-size:9px;letter-spacing:.12em;color:var(--ink-3);writing-mode:vertical-rl;margin:6px 0;text-transform:uppercase}
.plugin-rail button{width:56px;border:1px solid transparent;background:transparent;border-radius:11px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-3)}
.plugin-rail button:hover{background:var(--surface-2);color:var(--ink-2)}
.plugin-rail button[aria-pressed=true]{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.plugin-rail button .plugin-glyph{width:30px;height:30px;border-radius:9px;font-size:9px}
.plugin-rail button small{font-size:8.5px;line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54px}
.patch-main{padding:22px 24px 110px;overflow:auto;min-width:0}
.patch-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.patch-head h1{font-size:22px}
.profile-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.profile-tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;font-size:11.5px;color:var(--ink-3)}
.profile-tab[aria-selected=true]{border-color:rgba(231,185,111,.5);background:var(--amber-soft);color:var(--amber)}
.chain-wrap{border:1px solid var(--line);border-radius:22px;background:
  radial-gradient(700px 300px at 50% 50%,rgba(231,185,111,.06),transparent 70%),#15181a;padding:24px;min-height:430px;display:flex;align-items:center;justify-content:center;gap:0;overflow:auto}
.chain-node{border:1px solid var(--line-strong);background:linear-gradient(180deg,var(--surface-2),rgba(24,27,30,.9));border-radius:17px;padding:16px;min-width:180px;max-width:240px;position:relative}
.chain-node.device-node{background:transparent;border-style:dashed;text-align:center;min-width:160px;padding:10px}
.chain-node.device-node .vibe-key{width:142px;margin:0 auto}
.chain-node.device-node h3{margin-top:4px;font-size:12px}
.chain-node.device-node small{display:block;font-size:10.5px}
.chain-node.plugin-node{min-width:230px}
.chain-node .node-eyebrow{font:9px var(--mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.chain-node h2{font-size:18px;letter-spacing:-.35px;margin-top:8px}
.chain-node p{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:5px}
.chain-node .cap-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.chain-node .node-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.wire{height:1px;min-width:38px;background:linear-gradient(90deg,rgba(231,185,111,.15),rgba(231,185,111,.65),rgba(231,185,111,.15));position:relative;flex:1;max-width:74px}
.wire:before,.wire:after{content:"";position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--amber);opacity:.65}
.wire:before{left:0}.wire:after{right:0}
.wire span{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:8px var(--mono);color:var(--ink-3);white-space:nowrap;letter-spacing:.08em}
.action-node{min-width:250px}
.action-node ol{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.action-node li{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2);padding:6px 7px;border-radius:6px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.action-node li .n{font:9px var(--mono);color:var(--ink-3)}
.chain-meta{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:16px}
.meta-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--surface)}
.meta-card h3{font-size:11px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.meta-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:4px 0;color:var(--ink-2)}
.meta-row span:last-child{color:var(--ink-3);font-family:var(--mono);font-size:10.5px}
/* variant C */
.profiles-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;flex:1;min-height:0}
.profiles-main{padding:26px 28px 110px;overflow:auto}
.profiles-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:6px}
.profiles-head h1{font-size:28px}
.profiles-head p{font-size:12px;color:var(--ink-3);margin-top:6px}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:20px}
.big-profile{border:1px solid var(--line);border-radius:16px;background:linear-gradient(155deg,var(--surface-2),rgba(24,27,30,.6));padding:17px;text-align:left;min-height:206px;display:flex;flex-direction:column;gap:12px;transition:border-color .16s,transform .16s}
.big-profile:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.big-profile[data-selected=true]{border-color:rgba(231,185,111,.62);box-shadow:inset 0 0 0 1px rgba(231,185,111,.2)}
.big-profile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.big-profile h2{font-size:18px;letter-spacing:-.3px}
.big-profile .profile-steps{display:flex;flex-direction:column;gap:5px}
.big-profile .profile-steps span{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.big-profile .profile-steps .n{font:9px var(--mono);color:var(--ink-3)}
.big-profile .profile-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.key-badges{display:flex;gap:4px;flex-wrap:wrap}
.key-badge{font:9px var(--mono);border:1px solid rgba(231,185,111,.3);color:var(--amber);background:var(--amber-soft);border-radius:4px;padding:2px 5px}
.market{border-left:1px solid var(--line);background:var(--surface);padding:20px 16px 110px;overflow:auto}
.market-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.market-head h2{font-size:14px}
.plugin-row{border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;align-items:center;gap:9px;margin-bottom:7px;background:rgba(255,255,255,.012)}
.plugin-row b{display:block;font-size:12px;font-weight:500}
.plugin-row small{display:block;font-size:10px}
.plugin-row .grow{flex:1;min-width:0}
.plugin-row .btn{flex:none}
.device-dock{position:sticky;bottom:0;border-top:1px solid var(--line);background:rgba(17,19,21,.9);backdrop-filter:blur(16px);padding:12px 22px;display:flex;align-items:center;gap:18px;z-index:8}
.dock-device{display:flex;align-items:center;gap:8px}
.dock-device .vibe-key{width:56px;max-height:92px;filter:none}
.dock-copy{min-width:0}
.dock-copy b{font-size:12px;display:block}
.dock-copy small{display:block;margin-top:2px;font-size:10.5px}
.dock-keys{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.dock-key{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;text-align:left;min-width:92px}
.dock-key[aria-pressed=true]{border-color:rgba(231,185,111,.55);background:var(--amber-soft)}
.dock-key b{display:block;font-size:10.5px}
.dock-key small{display:block;font-size:9.5px;margin-top:1px}
/* plugin modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,7,8,.68);backdrop-filter:blur(6px);z-index:60;display:grid;place-items:center;padding:22px}
.modal{width:min(620px,100%);max-height:86vh;overflow:auto;border:1px solid var(--line-strong);border-radius:20px;background:linear-gradient(160deg,#202427,#15181a);box-shadow:0 30px 80px #000a;padding:22px}
.modal-head{display:flex;align-items:flex-start;gap:12px}
.modal-head h2{font-size:21px;letter-spacing:-.4px}
.modal-close{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-3)}
.modal .plugin-glyph{width:44px;height:44px;border-radius:12px;font-size:13px}
.modal p{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:8px}
.modal-caps{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.modal-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.modal-section h3{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.config-line{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:5px 0;color:var(--ink-2)}
.config-line span:last-child{color:var(--ink-3);font-family:var(--mono);font-size:11px}
.modal-actions{display:flex;gap:8px;margin-top:18px}
/* toast + switcher */
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);background:#252b28;border:1px solid rgba(127,211,182,.45);color:var(--jade);border-radius:999px;padding:9px 16px;font-size:12px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 12px 30px #0008;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.proto-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:4px;border:1px solid var(--line-strong);border-radius:999px;background:rgba(9,11,12,.86);backdrop-filter:blur(16px);padding:5px;box-shadow:0 18px 50px #0009}
.proto-bar .arrow{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;font-size:15px}
.proto-bar .arrow:hover{background:var(--surface-3);color:var(--ink)}
.proto-bar .label{min-width:196px;text-align:center;font-size:11.5px;color:var(--ink-2);padding:0 8px}
.proto-bar .label b{color:var(--amber);font-weight:600}
.proto-bar .label em{font-style:normal;color:var(--ink-3);font-size:10px;display:block;margin-top:1px}
.proto-bar .proto-tag{font:9px var(--mono);color:var(--ink-3);border-left:1px solid var(--line);padding:0 10px;margin-left:4px;letter-spacing:.08em}
/* responsive */
@media(max-width:1280px){.workbench{grid-template-columns:206px minmax(0,1fr) 350px}.stage{grid-template-columns:minmax(280px,1fr) 248px}.vibe-key{width:300px}}
@media(max-width:1100px){.workbench{grid-template-columns:1fr}.rail{display:none}.inspector{border-left:0;border-top:1px solid var(--line)}.workbench-b{grid-template-columns:1fr}.plugin-rail{display:none}.profiles-wrap{grid-template-columns:1fr}.market{border-left:0;border-top:1px solid var(--line)}.stage{grid-template-columns:1fr}.callouts{display:grid;grid-template-columns:1fr 1fr;padding:0 4px 10px}.stage-device{min-height:430px}.vibe-key{width:280px}.canvas{padding:20px 16px 110px}.inspector{padding:18px 16px}.profiles-main{padding:20px 16px 110px}}
@media(max-width:720px){.topbar{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 14px;gap:10px}.brand{min-width:0}.crumbs{display:none}.stage{padding:14px}.callouts{grid-template-columns:1fr}.stage-device{min-height:350px}.vibe-key{width:230px}.inspector-head h2{font-size:17px}.profile-deck{grid-auto-columns:190px}.chain-wrap{padding:14px;flex-direction:column;gap:12px}.wire{width:1px;height:26px;max-width:none;background:linear-gradient(180deg,rgba(231,185,111,.15),rgba(231,185,111,.65),rgba(231,185,111,.15))}.wire:before,.wire:after{left:-2px;top:0}.wire:before{top:0}.wire:after{top:auto;bottom:0}.wire span{top:50%;left:10px;transform:translateY(-50%)}.chain-node{width:100%;max-width:none}.chain-meta{grid-template-columns:1fr}.profiles-head{align-items:flex-start;flex-direction:column}.device-dock{flex-wrap:wrap}.dock-keys{width:100%;margin-left:0}.proto-bar .label{min-width:160px}.proto-bar .proto-tag{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<body>
<div class="app" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<div class="proto-bar" role="navigation" aria-label="原型方向切换">
  <button class="arrow" data-action="variant-prev" aria-label="上一个方向">‹</button>
  <div class="label" id="protoLabel"></div>
  <button class="arrow" data-action="variant-next" aria-label="下一个方向">›</button>
  <span class="proto-tag">PROTOTYPE · 不写入配置</span>
</div>
<script>
/* ── 原型数据（全部是演示数据，不访问网络、不写配置） ───────────────────── */
const ICONS={
  mic:'<path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',
  check:'<path d="m5 12 4 4L19 6"/>',
  x:'<path d="m6 6 12 12M18 6 6 18"/>',
  knob:'<circle cx="12" cy="12" r="8"/><path d="M12 4v3M12 17v3"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  command:'<path d="M9 6V5a3 3 0 1 1 3 3v8a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3v-8a3 3 0 1 1 3 3"/>',
  play:'<path d="M7 4v16l13-8Z"/>',
  chevron:'<path d="m9 6 6 6-6 6"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  wand:'<path d="m15 4 5 5M13 6l1.5-1.5M4 20 17 7M5 15l4 4"/>'
};
function icon(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||''}</svg>`}

const PLUGINS=[
  {id:'au05',name:'Ulanzi Vibe Key',vendor:'Ulanzi',kind:'设备插件',version:'1.4.0',installed:true,status:'connected',glyph:'VK',accent:'#e7b96f',desc:'3 个按键、旋钮与全向麦克风。通过 2.4G 接收器连接，配置和固件写入都走本机服务，不需要 Ulanzi Studio。',caps:['按键映射','旋钮','固件直发','麦克风'],config:[['设备','AU05 · 4.4.0'],['连接','2.4G 接收器'],['按键','3 键 + 旋钮'],['默认配置','已写入并读回']]},
  {id:'codex',name:'Codex',vendor:'OpenAI',kind:'应用插件',version:'1.2.0',installed:true,status:'ready',glyph:'CX',accent:'#9eb8d8',desc:'启动或聚焦 Codex，向当前会话发送语音与命令快捷键，并读取前台窗口状态。',caps:['启动应用','发送快捷键','语音会话'],config:[['应用','Codex.app'],['语音快捷键','Ctrl + Shift + Space'],['前台检测','已授权']]},
  {id:'dsh',name:'DeepSeek Harness',vendor:'DeepSeek',kind:'应用插件',version:'1.0.3',installed:true,status:'ready',glyph:'DS',accent:'#b8a8e6',desc:'连接本机 DSH 工作台，聚焦浏览器窗口，切换语音输入或打开命令面板。',caps:['启动应用','浏览器工作台','语音'],config:[['工作台','127.0.0.1:50845'],['语音','在本机服务中配置'],['窗口','Chrome / Edge']]},
  {id:'wechat',name:'微信输入法',vendor:'Tencent',kind:'应用插件',version:'1.1.0',installed:true,status:'ready',glyph:'微',accent:'#7fd3b6',desc:'唤起微信输入法语音面板，把快捷键发送到当前前台应用。',caps:['语音面板','发送快捷键'],config:[['语音快捷键','Ctrl + Win'],['目标','前台应用']]},
  {id:'workbuddy',name:'WorkBuddy',vendor:'WorkBuddy',kind:'应用插件',version:'0.9.0',installed:false,status:'not-installed',glyph:'WB',accent:'#e7a97f',desc:'启动 WorkBuddy 并开始语音会话。安装后可把按键直接绑定到它的语音开关。',caps:['启动应用','语音会话'],config:[]},
  {id:'gamepad',name:'Sony 白色手柄',vendor:'Sony',kind:'设备插件',version:'1.0.0',installed:true,status:'waiting',glyph:'PS',accent:'#9fc9c0',desc:'Sony DualSense / DualShock 白色手柄，通过 USB-C 或蓝牙 HID 连接。Windows 当前只枚举到 WH-1000XM5 耳机，还没有手柄；连接后会自动出现在设备列表。',caps:['按键学习','组合动作','蓝牙 / USB'],config:[['设备','未检测到'],['型号','Sony（白色）'],['连接','USB-C / 蓝牙'],['映射','触控板 / 按键 / 摇杆']]},
  {id:'scripts',name:'脚本与命令',vendor:'VibDock',kind:'动作插件',version:'1.0.0',installed:true,status:'ready',glyph:'</>',accent:'#c9b98f',desc:'本机结构化命令、参数与等待步骤。可组合进任何 profile，不经过 shell 字符串。',caps:['命令','参数','等待'],config:[['命令文件','commands.json'],['命令数','4'],['执行','argv 参数']]}
];
const PROFILES=[
  {id:'wechat',name:'微信语音',plugin:'wechat',color:'#7fd3b6',desc:'一键唤起微信输入法语音，再按结束。',steps:[{i:'send',t:'发送 Ctrl + Win 微信语音'}]},
  {id:'codex',name:'Codex 语音',plugin:'codex',color:'#9eb8d8',desc:'打开 Codex，切换麦克风并进入语音会话。',steps:[{i:'launch',t:'启动 / 聚焦 Codex'},{i:'wait',t:'等待 400 ms'},{i:'mic',t:'麦克风切换'},{i:'send',t:'发送 Ctrl + Shift + Space'}]},
  {id:'dsh',name:'DSH 工作台',plugin:'dsh',color:'#b8a8e6',desc:'聚焦 DeepSeek Harness，打开语音或命令面板。',steps:[{i:'launch',t:'打开 DSH 工作台'},{i:'focus',t:'聚焦浏览器窗口'},{i:'send',t:'发送语音快捷键'}]},
  {id:'workbuddy',name:'WorkBuddy',plugin:'workbuddy',color:'#e7a97f',desc:'启动 WorkBuddy 并开始语音。需要先安装插件。',steps:[{i:'launch',t:'启动 WorkBuddy'},{i:'mic',t:'切换麦克风'},{i:'send',t:'开始语音'}]},
  {id:'media',name:'媒体控制',plugin:'scripts',color:'#c9b98f',desc:'播放 / 暂停、上一首、下一首。',steps:[{i:'send',t:'发送媒体播放快捷键'},{i:'send',t:'发送上一首'}]}
];
const KEYS=[{id:'button1',label:'语音键',idx:'01',icon:'mic',hint:'按住说话 / 切换语音'},{id:'button2',label:'确认键',idx:'02',icon:'check',hint:'确认 / 发送'},{id:'button3',label:'取消键',idx:'03',icon:'x',hint:'取消 / 返回'},{id:'knob',label:'旋钮',idx:'04',icon:'knob',hint:'旋转切换 profile，按下确认'}];

let state={
  variant:new URL(location.href).searchParams.get('variant')||'A',
  key:'button1',
  focusPlugin:'wechat',
  activeProfile:'codex',
  assignments:{button1:'wechat',button2:'codex',button3:'dsh'},
  installed:new Set(PLUGINS.filter(p=>p.installed).map(p=>p.id)),
  modal:null
};
const VARIANT_NAMES={A:'设备画布',B:'信号链',C:'Profile 面板'};
const VARIANT_ORDER=['A','B','C'];
let toastTimer=0;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function plugin(id){return PLUGINS.find(p=>p.id===id)}
function profile(id){return PROFILES.find(p=>p.id===id)}
function assignedProfile(keyId){return profile(state.assignments[keyId])}
function assignedName(keyId){const p=assignedProfile(keyId);return p?p.name:'未配置'}
function pluginOfProfile(p){return p?plugin(p.plugin):null}
function isInstalled(id){return state.installed.has(id)}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function setVariant(v){if(!VARIANT_ORDER.includes(v))return;state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
function cycleVariant(dir){const i=VARIANT_ORDER.indexOf(state.variant);setVariant(VARIANT_ORDER[(i+dir+VARIANT_ORDER.length)%VARIANT_ORDER.length])}
function selectKey(id){state.key=id;if(id==='knob'){showToast('旋钮用于切换 profile：点击下方 profile 可应用到当前按键')}render()}
function assignProfile(pid){const p=profile(pid);if(!p)return;if(state.key==='knob'){state.activeProfile=pid;showToast(`旋钮当前指向「${p.name}」`);render();return}state.assignments[state.key]=pid;state.activeProfile=pid;showToast(`已把「${p.name}」分配给 ${KEYS.find(k=>k.id===state.key).label}（原型预览）`);render()}
function togglePlugin(id){const p=plugin(id);if(!p)return;if(id==='au05'||id==='gamepad'||id==='scripts'){showToast('内置插件不能卸载');return}if(isInstalled(id)){state.installed.delete(id);showToast(`已停用 ${p.name}（原型预览）`)}else{state.installed.add(id);showToast(`已安装 ${p.name}，可创建 profile（原型预览）`)}state.modal=id;render()}
function render(){document.getElementById('app').innerHTML=state.variant==='A'?renderA():state.variant==='B'?renderB():renderC();renderModal();const label=document.getElementById('protoLabel');label.innerHTML=`<b>${state.variant} · ${VARIANT_NAMES[state.variant]}</b><em>← / → 切换方向 · 点击设备按键或 profile 试用</em>`}

/* ── shared chrome ─────────────────────────────────────────────────────── */
function topbar(){
  return `<header class="topbar">
    <div class="brand"><div class="brand-mark">VK</div><div><b>Vib<span>Dock</span></b><small>plugin workbench</small></div></div>
    <div class="crumbs"><span>工作台</span><span class="slash">/</span><b>Vibe Key</b><span class="slash">/</span><span>配置</span></div>
    <div class="top-actions">
      <span class="conn-pill"><span class="dot live"></span>本机服务 · 已连接</span>
      <span class="tag">${isInstalled('au05')?'AU05 已连接':'AU05 未连接'}</span>
      <button class="avatar" data-action="noop" aria-label="账户">LH</button>
    </div>
  </header>`
}
function pluginGlyph(p,cls=''){return `<span class="plugin-glyph ${cls}" style="color:${p.accent};background:${p.accent}14;border-color:${p.accent}35">${esc(p.glyph)}</span>`}
function pluginMiniList(){
  return PLUGINS.filter(p=>p.kind!=='动作插件').map(p=>`<button class="plugin-mini" data-action="open-plugin" data-plugin="${p.id}">
    ${pluginGlyph(p)}<span style="min-width:0"><b>${esc(p.name)}</b><small>${isInstalled(p.id)?'已安装':'未安装'}</small></span>
    <span class="dot ${isInstalled(p.id)?(p.status==='waiting'?'warn':'live'):'off'}"></span>
  </button>`).join('')
}
function keyCallouts(){
  return `<div class="callouts">${KEYS.map(k=>{
    const active=state.key===k.id;
    const sub=k.id==='knob'?`点击切换 profile`:`${assignedName(k.id)}${assignedProfile(k.id)?' · '+assignedProfile(k.id).steps.length+' 步':''}`;
    return `<button class="callout" data-action="select-key" data-key="${k.id}" aria-pressed="${active}">
      <span class="idx">${k.idx}</span><span><b>${k.label}</b><small>${esc(sub)}</small></span>
      <span class="dot ${active?'warn':(k.id==='knob'?'off':'live')}"></span>
    </button>`}).join('')}</div>`
}
function profileDeck(){
  return `<div class="deck-head"><h2>Profile 库</h2><small>点击卡片应用到当前按键 · 由插件提供</small></div>
  <div class="profile-deck">${PROFILES.map(p=>{
    const assigned=state.assignments[state.key]===p.id;
    const pl=pluginOfProfile(p);const installed=isInstalled(p.plugin);
    return `<button class="profile-card" data-action="assign-profile" data-profile="${p.id}" data-assigned="${assigned}">
      <div class="profile-card-top"><b>${esc(p.name)}</b>${assigned?'<span class="assign-mark">当前</span>':`<span class="tag" style="color:${p.color};border-color:${p.color}35">${esc(pl?pl.vendor:'')}</span>`}</div>
      <p>${esc(p.desc)}</p>
      <div class="steps-mini">${p.steps.slice(0,3).map(s=>`<span class="chip">${esc(s.t)}</span>`).join('')}${p.steps.length>3?`<span class="chip">+${p.steps.length-3}</span>`:''}</div>
      ${installed?'':'<span class="field-note" style="color:var(--red)">需要安装插件</span>'}
    </button>`}).join('')}</div>`
}
function inspector(selectedKey=state.key){
  const k=KEYS.find(x=>x.id===selectedKey)||KEYS[0];
  const p=assignedProfile(selectedKey);
  const pl=p?pluginOfProfile(p):null;
  const knob=selectedKey==='knob';
  return `<aside class="inspector">
    <div class="inspector-head"><div><div class="eyebrow">${knob?'PROFILE DIAL':'KEY ASSIGNMENT'}</div><h2>${knob?'旋钮':k.label}</h2><small>${knob?'旋转切换 profile，按下确认':'按下时执行一个 profile 的动作序列'}</small></div><span class="tag ${p?'jade':''}">${knob?'轮盘':(p?'已配置':'空')}</span></div>
    ${knob?`
      <label>Profile 轮盘</label>

    <div class="modal-head">${pluginGlyph(p)}<div><h2 id="modalTitle">${esc(p.name)}</h2><small>${esc(p.kind)} · ${esc(p.vendor)} · v${esc(p.version)}</small></div><button class="modal-close" data-action="close-modal" aria-label="关闭">×</button></div>
    <p>${esc(p.desc)}</p>
    <div class="modal-caps">${p.caps.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
    <div class="modal-section"><h3>能力与配置</h3>${p.config.map(([a,b])=>`<div class="config-line"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join('')||'<p>安装后由插件声明配置项，工作台自动生成表单。</p>'}</div>
    <div class="modal-section"><h3>提供的 profile</h3>${PROFILES.filter(x=>x.plugin===p.id).map(x=>`<div class="config-line"><span>${esc(x.name)}</span><span>${x.steps.length} 步</span></div>`).join('')||'<p>这个插件还没有提供 profile。</p>'}</div>
    <div class="modal-actions"><button class="btn" data-action="close-modal">关闭</button>${['au05','gamepad','scripts'].includes(p.id)?'<button class="btn primary" data-action="close-modal">设备设置</button>':`<button class="btn ${isInstalled(p.id)?'danger':'primary'}" data-action="toggle-plugin" data-plugin="${p.id}">${isInstalled(p.id)?'停用插件':'安装插件'}</button>`}</div>
  </div></div>`
}

/* ── events ────────────────────────────────────────────────────────────── */
document.addEventListener('click',e=>{
  if(e.target.closest('.modal')&&!e.target.closest('[data-action]'))return;
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  if(a==='variant-prev')return cycleVariant(-1);
  if(a==='variant-next')return cycleVariant(1);
  if(a==='select-key')return selectKey(el.dataset.key);
  if(a==='assign-profile')return assignProfile(el.dataset.profile);
  if(a==='open-plugin'){state.modal=el.dataset.plugin;return render()}
  if(a==='close-modal'){state.modal=null;return render()}
  if(a==='toggle-plugin'){togglePlugin(el.dataset.plugin);return render()}
  if(a==='auto-config'){state.assignments.button1='wechat';state.assignments.button2='codex';state.assignments.button3='dsh';showToast('已生成推荐配置：语音键 → 微信语音，确认键 → Codex，取消键 → DSH（原型预览）');return render()}
  if(a==='focus-plugin'){state.focusPlugin=el.dataset.plugin;return render()}
  if(a==='select-profile-card'){state.activeProfile=el.dataset.profile;showToast(`正在编辑「${profile(el.dataset.profile)?.name}」`);return render()}
  if(a==='noop')return showToast('原型交互：这个操作在接入服务后生效')
  showToast('原型交互：这个操作在接入服务后生效')
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  if(el.dataset.action==='select-plugin'){state.focusPlugin=el.value;showToast('已切换插件（原型预览）');render()}
  if(el.dataset.action==='select-profile'){assignProfile(el.value)}
});
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(['input','textarea','select'].includes(tag)||e.target.isContentEditable)return;
  if(e.key==='Escape'&&state.modal){state.modal=null;render();return}
  if(e.key==='ArrowRight'){e.preventDefault();cycleVariant(1)}
  if(e.key==='ArrowLeft'){e.preventDefault();cycleVariant(-1)}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action]')){e.preventDefault();e.target.click()}
});
render();
</script>
</body></html>
