[package]
name = "vibdock-device-gamepad"
version = "0.5.0"
edition = "2021"
license = "MIT"
publish = false
description = "Generic Windows HID game-controller input adapter."

[lib]
name = "vibdock_device_gamepad"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Foundation"] }

