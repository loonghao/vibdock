name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Verify Windows service resilience
        if: runner.os == 'Windows'
        run: node scripts/test-service-resilience.cjs target/release/vibdock.exe
      - name: Verify native Windows resident panel
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-desktop.ps1
      - name: Verify homepage in a real browser
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match :lang=zh
          npm install --prefix work/browser --no-package-lock --ignore-scripts playwright@1.60.0
          PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright" CHROMIUM_PATH="$(command -v google-chrome)" node scripts/test-web-ui.cjs target/release/vibdock
      - name: Upload desktop and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            work/windows-desktop/*.png
            work/windows-desktop/report.json
            work/web-ui/*.png
            work/web-ui/report.json
          if-no-files-found: ignore
