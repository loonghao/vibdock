name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VIBDOCK_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Verify binding UI contracts
        run: node scripts/test-binding-ui.cjs
      - run: cargo build --locked --release
      - name: Verify macOS package contracts
        run: python3 scripts/test-macos-package.py
      - name: Package native macOS candidate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python3 scripts/package-macos.py --target "$target" --tag "candidate-${VIBDOCK_SOURCE_REVISION:0:12}"
          plutil -lint work/macos-package/VibDock.app/Contents/Info.plist
      - name: Verify native macOS resident lifecycle
        if: runner.os == 'macOS'
        run: python3 scripts/test-macos-desktop.py
      - name: Upload macOS candidate archive
        if: runner.os == 'macOS' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibdock-macos-candidate
          path: |
            work/macos-package/vibdock-candidate-*.zip
            work/macos-package/vibdock-candidate-*.zip.sha256
          if-no-files-found: error
      - name: Verify contained Windows action helper without changing audio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VIBDOCK_ACTION_HELPER_EXE = (Resolve-Path target/release/vibdock.exe).Path
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ('vibdock-action-helper-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA | Out-Null
          try {
            cargo test --locked --lib contained_action_helper_rejects_impossible_identity -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Contained native action helper acceptance failed' }
          } finally {
            Remove-Item -LiteralPath $env:LOCALAPPDATA -Recurse -Force
          }
      - name: Verify Windows service resilience
        if: runner.os == 'Windows'
        run: node scripts/test-service-resilience.cjs target/release/vibdock.exe
      - name: Verify voice scenario service contracts
        if: runner.os == 'Windows'
        run: node scripts/test-voice-e2e.cjs target/release/vibdock.exe --output work/voice-e2e/ci
      - name: Verify Windows software settings in a real browser
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --prefix work/browser --no-package-lock --ignore-scripts playwright@1.60.0
          $env:PLAYWRIGHT_MODULE = "$PWD/work/browser/node_modules/playwright"
          $env:CHROMIUM_PATH = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          node scripts/test-web-ui-windows.cjs target/release/vibdock.exe work/web-ui-windows
      - name: Verify native software strip contracts
        if: runner.os == 'Windows'
        run: cargo test --locked --lib tray::tests::native_strip_render_probe -- --ignored --exact --nocapture --test-threads=1
      - name: Verify native Windows tray lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-desktop.ps1
      - name: Verify homepage in a real browser
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match :lang=zh
          npm install --prefix work/browser --no-package-lock --ignore-scripts playwright@1.60.0
          PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright" CHROMIUM_PATH="$(command -v google-chrome)" node scripts/test-web-ui.cjs target/release/vibdock
      - name: Verify macOS software settings in a real browser
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm install --prefix work/browser --no-package-lock --ignore-scripts playwright@1.60.0
          PLAYWRIGHT_MODULE="$PWD/work/browser/node_modules/playwright" CHROMIUM_PATH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" node scripts/test-web-ui.cjs target/release/vibdock
      - name: Verify packaging and create Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-package-release.ps1
          $target = 'x86_64-pc-windows-msvc'
          $release = "target/$target/release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item target/release/vibdock.exe,target/release/vibdock-launcher.exe -Destination $release
          $tag = 'candidate-' + $env:VIBDOCK_SOURCE_REVISION.Substring(0, 12)
          ./scripts/package-release.ps1 -Tag $tag -Target $target -CliExecutable vibdock.exe -LauncherExecutable vibdock-launcher.exe
          ./scripts/verify-windows-package.ps1 -Archive "vibdock-$tag-$target.zip" -EvidenceDirectory work/package-check
      - name: Upload Windows candidate archive
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibdock-windows-candidate
          path: |
            vibdock-candidate-*.zip
            vibdock-candidate-*.zip.sha256
          if-no-files-found: error
      - name: Upload desktop and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            work/windows-desktop/*.png
            work/windows-desktop/report.json
            work/windows-desktop/failure.json
            work/web-ui/*.png
            work/web-ui/report.json
            work/voice-e2e/ci/*.json
            work/voice-e2e/ci/*.log
            work/macos-desktop/*.png
            work/macos-desktop/report*.json
            work/web-ui-windows/*.png
            work/web-ui-windows/report.json
          if-no-files-found: ignore
