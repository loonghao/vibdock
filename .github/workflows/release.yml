name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cli: vibdock.exe
            launcher: vibdock-launcher.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli: vibdock
          - os: macos-latest
            target: aarch64-apple-darwin
            cli: vibdock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # GITHUB_TOKEN-created tags do not trigger another workflow: publish here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and checksum
        if: runner.os != 'macOS'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
          CLI_EXECUTABLE: ${{ matrix.cli }}
          LAUNCHER_EXECUTABLE: ${{ matrix.launcher }}
        run: |
          # Windows target packages vibdock.exe + vibdock-launcher.exe + README.md,
          # fails on any missing artifact, and verifies the console/GUI subsystems.
          # Linux packages the CLI only; macOS uses the native .app step below.
          ./scripts/package-release.ps1 `
            -Tag $env:RELEASE_TAG `
            -Target $env:RELEASE_TARGET `
            -CliExecutable $env:CLI_EXECUTABLE `
            -LauncherExecutable $env:LAUNCHER_EXECUTABLE
      - name: Package macOS native application
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
          VIBDOCK_SOURCE_REVISION: ${{ needs.release-please.outputs.sha }}
        run: |
          python3 scripts/test-macos-package.py
          python3 scripts/package-macos.py --tag "$RELEASE_TAG" --target "$RELEASE_TARGET" --binary-directory "target/$RELEASE_TARGET/release"
          python3 scripts/test-macos-desktop.py
          cp work/macos-package/vibdock-*.zip work/macos-package/vibdock-*.zip.sha256 .
      - name: Upload binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $package = "vibdock-$env:RELEASE_TAG-$env:RELEASE_TARGET"
          $archive = if ($IsWindows -or $IsMacOS) { "$package.zip" } else { "$package.tar.gz" }
          gh release upload "$env:RELEASE_TAG" $archive "$archive.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
